name: iOS production build (free runner)

# Builds the signed App Store IPA on a GitHub-hosted macOS runner using
# `eas build --local`. Local builds do NOT consume the EAS Free-plan build
# quota — they only borrow credentials from the EAS servers — so this is the
# zero-cost path when the hosted quota is exhausted.
#
# Requires one repository secret:
#   EXPO_TOKEN  — expo.dev -> Account Settings -> Access Tokens -> Create
#
# Optional, to also upload to App Store Connect in the same run:
#   ASC_KEY_P8      — contents of the AuthKey .p8 (App Store Connect API key)
#   ASC_KEY_ID      — e.g. 27A6X9P27C
#   ASC_ISSUER_ID   — e.g. 884ed5da-6ca7-44a8-8935-44e24dea4649

on:
  workflow_dispatch:
    inputs:
      submit:
        description: "Upload the build to App Store Connect after building"
        type: boolean
        default: false

jobs:
  build:
    # macos-26 for Xcode 26. macos-15 ships Xcode 16.4 / Swift tools 6.1, and
    # expo-modules-jsi pulls a package requiring Swift tools 6.2 — its
    # xcframework script phase fails the archive. Apple also rejects uploads
    # not built against the iOS 26 SDK (ITMS-90725).
    runs-on: macos-26
    timeout-minutes: 90
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EAS_SKIP_AUTO_FINGERPRINT: "1"
      EAS_BUILD_NO_EXPO_GO_WARNING: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Xcode is new enough
        run: |
          xcodebuild -version
          MAJOR=$(xcodebuild -version | head -1 | sed -E 's/Xcode ([0-9]+).*/\1/')
          if [ "$MAJOR" -lt 26 ]; then
            echo "::error::Xcode $MAJOR too old; need 26+ for Swift tools 6.2 and the iOS 26 SDK."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Verify the lockfile matches package.json
        # EAS runs `npm ci`, which refuses to install on drift. Catch it here
        # rather than 15 seconds into a 40-minute build.
        run: npm ci --include=dev

      - name: Tests and typecheck
        run: |
          npx --yes bun@1.3.14 test
          npx tsc --noEmit

      - name: Build signed IPA
        env:
          # Keep the build tree after a failure. By default eas build --local
          # works in a temp dir and deletes it on exit, taking the raw
          # xcodebuild logs with it — which is why the first attempt to
          # collect them found nothing. These belong on the step, not the job:
          # the `runner` context does not resolve in job-level env.
          EAS_LOCAL_BUILD_WORKINGDIR: ${{ runner.temp }}/easbuild
          EAS_LOCAL_BUILD_SKIP_CLEANUP: "1"
        run: |
          npx eas-cli@latest build \
            --platform ios \
            --profile production \
            --local \
            --non-interactive \
            --output "$RUNNER_TEMP/anker.ipa"

      - name: Collect Xcode logs on failure
        if: failure()
        # EAS local builds run gym with suppress_xcode_output, writing the real
        # compiler output to a temp dir instead of the job log. Without this a
        # failing script phase surfaces only as "Exit status: 65" and fastlane's
        # error scanner guesses badly at the cause.
        run: |
          mkdir -p "$RUNNER_TEMP/xcodelogs"
          for root in "$RUNNER_TEMP/easbuild" "${TMPDIR:-/tmp}"; do
            [ -d "$root" ] || continue
            find "$root" \( -name '*.log' -o -path '*/logs/*' \) -type f -size -20M \
              -exec cp {} "$RUNNER_TEMP/xcodelogs/" \; 2>/dev/null || true
          done
          echo "collected:"
          ls -la "$RUNNER_TEMP/xcodelogs" || true

      - name: Upload Xcode logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-build-logs
          path: ${{ runner.temp }}/xcodelogs
          retention-days: 7
          # error, not warn: a silent empty artifact is what made the previous
          # failure undiagnosable.
          if-no-files-found: error

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: anker-ios-ipa
          path: ${{ runner.temp }}/anker.ipa
          retention-days: 14

      - name: Upload to App Store Connect
        if: ${{ inputs.submit }}
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          if [ -z "$ASC_KEY_P8" ]; then
            echo "ASC_* secrets not set — skipping upload. Download the artifact and use Transporter."
            exit 0
          fi
          mkdir -p ~/private_keys
          printf '%s' "$ASC_KEY_P8" > ~/private_keys/AuthKey_${ASC_KEY_ID}.p8
          xcrun altool --upload-app \
            --type ios \
            --file "$RUNNER_TEMP/anker.ipa" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"
