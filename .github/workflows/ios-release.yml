name: iOS production build (free runner)

# Builds the signed App Store IPA on a GitHub-hosted macOS runner using
# `eas build --local`. Local builds do NOT consume the EAS Free-plan build
# quota — they only borrow credentials from the EAS servers — so this is the
# zero-cost path when the hosted quota is exhausted.
#
# Requires one repository secret:
#   EXPO_TOKEN  — expo.dev -> Account Settings -> Access Tokens -> Create
#
# Optional, to also upload to App Store Connect in the same run:
#   ASC_KEY_P8      — contents of the AuthKey .p8 (App Store Connect API key)
#   ASC_KEY_ID      — e.g. 27A6X9P27C
#   ASC_ISSUER_ID   — e.g. 884ed5da-6ca7-44a8-8935-44e24dea4649

on:
  workflow_dispatch:
    inputs:
      submit:
        description: "Upload the build to App Store Connect after building"
        type: boolean
        default: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EAS_SKIP_AUTO_FINGERPRINT: "1"
      EAS_BUILD_NO_EXPO_GO_WARNING: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Verify the lockfile matches package.json
        # EAS runs `npm ci`, which refuses to install on drift. Catch it here
        # rather than 15 seconds into a 40-minute build.
        run: npm ci --include=dev

      - name: Tests and typecheck
        run: |
          npx --yes bun@1.3.14 test
          npx tsc --noEmit

      - name: Build signed IPA
        run: |
          npx eas-cli@latest build \
            --platform ios \
            --profile production \
            --local \
            --non-interactive \
            --output "$RUNNER_TEMP/anker.ipa"

      - name: Collect Xcode logs on failure
        if: failure()
        # EAS local builds run gym with suppress_xcode_output, writing the real
        # compiler output to a temp dir instead of the job log. Without this a
        # failing script phase surfaces only as "Exit status: 65" and fastlane's
        # error scanner guesses badly at the cause.
        run: |
          mkdir -p "$RUNNER_TEMP/xcodelogs"
          find "${TMPDIR:-/tmp}" -path '*eas-build-local-nodejs*/logs/*' -type f \
            -exec cp {} "$RUNNER_TEMP/xcodelogs/" \; 2>/dev/null || true
          find "${TMPDIR:-/tmp}" -name '*.xcresult' -maxdepth 2 -print 2>/dev/null || true
          ls -la "$RUNNER_TEMP/xcodelogs" || true

      - name: Upload Xcode logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-build-logs
          path: ${{ runner.temp }}/xcodelogs
          retention-days: 7
          if-no-files-found: warn

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: anker-ios-ipa
          path: ${{ runner.temp }}/anker.ipa
          retention-days: 14

      - name: Upload to App Store Connect
        if: ${{ inputs.submit }}
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          if [ -z "$ASC_KEY_P8" ]; then
            echo "ASC_* secrets not set — skipping upload. Download the artifact and use Transporter."
            exit 0
          fi
          mkdir -p ~/private_keys
          printf '%s' "$ASC_KEY_P8" > ~/private_keys/AuthKey_${ASC_KEY_ID}.p8
          xcrun altool --upload-app \
            --type ios \
            --file "$RUNNER_TEMP/anker.ipa" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"
